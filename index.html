<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Thanksgiving Turkey Giveaway — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#2a0708;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
a{color:#e8c070;} a:hover{color:#f6dca0;}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;background:radial-gradient(120% 90% at 70% 0%,#6e1416 0%,#3a0a0c 55%,#24060a 100%);font-family:'Fira Sans',system-ui,sans-serif;color:#fbf1df;">
  <div style="flex:1 1 440px;max-width:760px;display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,40px);">
    <img src="assets/flyer.png" alt="Thanksgiving Food Distribution &amp; Turkey Giveaway — Sunday, November 22, 2026, 9:00 AM, W 175th St &amp; St. Nicholas Ave, New York, NY 10033" style="width:auto;max-width:100%;height:auto;max-height:calc(100vh - 48px);aspect-ratio:1440/1865;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 2px rgba(232,192,112,.5);display:block;">
  </div>
  <div style="flex:1 1 400px;max-width:560px;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.4vh,26px);padding:clamp(20px,3vw,48px);">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <div style="font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#e8c070;font-weight:600;">{{ t.kicker }}</div>
      <div style="display:flex;border:1px solid rgba(232,192,112,.55);border-radius:999px;overflow:hidden;">
        <button onClick="{{ setEn }}" style="{{ enStyle }}">EN</button>
        <button onClick="{{ setEs }}" style="{{ esStyle }}">ES</button>
      </div>
    </div>

    <sc-if value="{{ isEntry }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:clamp(14px,2.2vh,24px);">
        <div>
          <h1 style="margin:0;font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(34px,4.2vw,52px);line-height:1.02;color:#f6e3b4;text-wrap:balance;">{{ t.title }}</h1>
        </div>

        <div style="{{ displayStyle }}">
          <div style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9fb7a6;font-weight:600;">{{ t.label }}</div>
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:clamp(20px,2vw,26px);color:#9fb7a6;font-weight:500;">+1</span>
            <span style="{{ numberStyle }}">{{ display }}</span>
          </div>
          <sc-if value="{{ error }}">
            <div style="font-size:15px;color:#ffb3a0;font-weight:500;">{{ error }}</div>
          </sc-if>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,16px);">
          <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
            <button onClick="{{ k.press }}" aria-label="{{ k.aria }}" style="{{ k.style }}" style-active="transform:scale(.95);background:#e8c070;color:#3a0a0c;">
              <span style="font-size:{{ k.size }};font-weight:600;line-height:1;">{{ k.label }}</span>
              <span style="font-size:10px;letter-spacing:.18em;color:{{ k.subColor }};font-weight:500;min-height:10px;">{{ k.sub }}</span>
            </button>
          </sc-for>
        </div>

        <button onClick="{{ submit }}" disabled="{{ notReady }}" style="{{ submitStyle }}">{{ ctaLabel }}</button>
        <div style="font-size:13px;line-height:1.45;color:#c9b597;text-align:center;text-wrap:pretty;">{{ t.legal }}</div>
      </div>
    </sc-if>

    <sc-if value="{{ isDone }}">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding:24px 0;">
        <div style="width:120px;height:120px;border-radius:50%;background:#13281c;border:3px solid #e8c070;display:flex;align-items:center;justify-content:center;font-size:62px;color:#e8c070;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;">✓</div>
        <h1 style="margin:0;font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(36px,4.2vw,54px);line-height:1.05;color:#f6e3b4;text-wrap:balance;">{{ t.doneTitle }}</h1>
        <div style="font-size:clamp(24px,2.4vw,30px);font-weight:600;letter-spacing:.04em;color:#fbf1df;">+1 {{ display }}</div>
        <p style="margin:0;max-width:420px;font-size:18px;line-height:1.45;color:#ead9bd;text-wrap:pretty;">{{ t.doneSub }}</p>
        <div style="display:flex;flex-direction:column;gap:4px;padding:18px 26px;border-radius:14px;background:#13281c;border:1px solid rgba(232,192,112,.6);">
          <div style="font-weight:700;font-size:18px;letter-spacing:.04em;">{{ t.date }}</div>
          <div style="font-size:16px;color:#e8c070;">W 175th St &amp; St. Nicholas Ave · New York, NY</div>
        </div>
        <button onClick="{{ reset }}" style="margin-top:6px;min-height:56px;padding:0 32px;border-radius:999px;border:1px solid rgba(232,192,112,.7);background:transparent;color:#f6e3b4;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;">{{ t.again }} ({{ countdown }})</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;keyShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;round&quot;,&quot;square&quot;],&quot;default&quot;:&quot;round&quot;,&quot;tsType&quot;:&quot;'round'|'square'&quot;},&quot;resetSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:5,&quot;max&quot;:60,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;s&quot;}}">
// Sweepstouch: registro real en el opt-in + ticket por RawBT.
// ?sweepstake=<id> cambia el sorteo sin tocar el archivo.
const API = 'https://api.sweepstouch.com/api';
const SWEEPSTAKE_ID = new URLSearchParams(location.search).get('sweepstake') || '6ac7d25ff83f048de902c7b9';
const DEFAULT_TICKET = ['==============================', '{store}', '==============================', 'PHONE : {phone}', 'COUPON: {coupon}', 'DATE  : {date}', 'TIME  : {time}', '==============================', '{sweepstake}', '==============================', 'GOOD LUCK'].join('\n');

// Mismo ticket que la tablet (tablets-sweepstouch/libs/utils/rawBt.ts): texto
// monospace en un canvas que RawBT recibe como imagen. Una línea cuya variable
// sale vacía (el opt-in de CEOs no da cupón) no se imprime.
function printTicket(cfg, data) {
  const now = new Date();
  const vars = { store: (data.store || '').toUpperCase(), phone: data.phone, coupon: data.coupon || '', date: now.toLocaleDateString(), time: now.toLocaleTimeString(), sweepstake: (data.sweepstake || '').toUpperCase() };
  const lines = [];
  for (const line of String(cfg.template || DEFAULT_TICKET).split(/\r?\n/)) {
    let empty = false;
    const out = line.replace(/\{(\w+)\}/g, (m, k) => { if (!(k in vars)) return m; if (!vars[k]) empty = true; return vars[k]; });
    if (!empty) lines.push(out);
  }
  const lh = 34, pad = 24;
  const canvas = document.createElement('canvas');
  canvas.width = 576;
  canvas.height = pad * 2 + lines.length * lh;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'black'; ctx.font = '26px monospace'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, 16, pad + i * lh, canvas.width - 32));
  const img = canvas.toDataURL('image/png');
  // RawBT toma un iframe por trabajo; juntos se pisan, por eso van espaciados.
  const copies = Math.min(Math.max(Number(cfg.copies) || 1, 1), 5);
  for (let i = 0; i < copies; i++) {
    setTimeout(() => {
      const f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = 'rawbt:' + img;
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 2000);
    }, i * 2500);
  }
}

class Component extends DCLogic {
  state = { digits: '', lang: 'en', step: 'entry', error: '', shake: 0, countdown: 0, busy: false, cfg: null };
  T = {
    en: { kicker: 'Free registration', title: 'Enter your phone number to register.', label: 'Mobile number', cta: 'Register', legal: 'By registering you agree to receive event text messages. Msg & data rates may apply. Reply STOP to opt out.', doneTitle: 'You’re registered!', doneSub: 'We’ll text you a confirmation and a reminder. Show it at the distribution table.', date: 'Sunday, Nov 22, 2026 · 9:00 AM', again: 'Done', errLen: 'Please enter a 10‑digit number.', clear: 'Clear', del: 'Delete' },
    es: { kicker: 'Registro gratis', title: 'Ingresa tu número de teléfono para registrarte.', label: 'Número de celular', cta: 'Registrarme', legal: 'Al registrarte aceptas recibir mensajes de texto del evento. Pueden aplicar tarifas. Responde STOP para cancelar.', doneTitle: '¡Ya estás registrado!', doneSub: 'Te enviaremos una confirmación y un recordatorio. Muéstralo en la mesa de distribución.', date: 'Domingo 22 nov 2026 · 9:00 AM', again: 'Listo', errLen: 'Ingresa un número de 10 dígitos.', clear: 'Borrar', del: 'Eliminar' }
  };
  componentDidMount() {
    this.onKey = e => {
      if (this.state.step !== 'entry') { if (e.key === 'Enter' || e.key === 'Escape') this.reset(); return; }
      if (/^[0-9]$/.test(e.key)) this.press(e.key);
      else if (e.key === 'Backspace') this.back();
      else if (e.key === 'Escape') this.setState({ digits: '', error: '' });
      else if (e.key === 'Enter') this.submit();
    };
    window.addEventListener('keydown', this.onKey);
    this.loadConfig();
  }
  async loadConfig() {
    try {
      const sw = await fetch(API + '/sweepstakes/' + SWEEPSTAKE_ID).then(r => r.json());
      const storeId = (sw.storesData || [])[0];
      const store = storeId ? await fetch(API + '/store/' + storeId).then(r => r.json()).catch(() => ({})) : {};
      // En this.cfg y no sólo en state: submit la lee justo después del await.
      this.cfg = {
        storeId, storeName: store.name || '', name: sw.name || '',
        // Sin printTicket guardado = imprime (lo de siempre salvo el opt-in genérico).
        print: sw.printTicket ?? sw.optinType !== 'generic',
        copies: sw.ticketCopies || 1, template: sw.ticketTemplate || ''
      };
      this.setState({ cfg: this.cfg });
    } catch (e) {
      this.setState({ error: 'No se pudo cargar el sorteo. Revisa la conexión.' });
    }
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); clearInterval(this.timer); }
  press(d) { this.setState(s => s.digits.length >= 10 ? null : { digits: s.digits + d, error: '' }); }
  back() { this.setState(s => ({ digits: s.digits.slice(0, -1), error: '' })); }
  async submit() {
    if (this.state.busy) return;
    if (this.state.digits.length !== 10) { this.setState(s => ({ error: this.T[s.lang].errLen, shake: s.shake + 1 })); return; }
    if (!this.cfg?.storeId) { await this.loadConfig(); if (!this.cfg?.storeId) return; }
    const { storeId, storeName, name, print, copies, template } = this.cfg;
    const phone = this.state.digits;
    this.setState({ busy: true, error: '' });
    let resp;
    try {
      const r = await fetch(API + '/sweepstakes/participants/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sweepstakeId: SWEEPSTAKE_ID, storeId, customerPhone: phone, customerName: '', method: 'tablet', singleEntry: true })
      });
      resp = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(resp.error || resp.message || 'Error ' + r.status);
    } catch (e) {
      this.setState(s => ({ busy: false, error: e.message || 'No se pudo registrar. Intenta de nuevo.', shake: s.shake + 1 }));
      return;
    }
    if (print) printTicket({ copies, template }, { store: storeName, phone, coupon: resp.coupon, sweepstake: name });
    this.setState({ busy: false });
    const secs = Number(this.props.resetSeconds ?? 12);
    this.setState({ step: 'done', countdown: secs });
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.setState(s => { if (s.countdown <= 1) { clearInterval(this.timer); return { step: 'entry', digits: '', countdown: 0 }; } return { countdown: s.countdown - 1 }; });
    }, 1000);
  }
  reset() { clearInterval(this.timer); this.setState({ step: 'entry', digits: '', error: '', countdown: 0 }); }
  fmt(d) {
    const p = (d + '__________').slice(0, 10);
    return '(' + p.slice(0, 3) + ') ' + p.slice(3, 6) + '-' + p.slice(6);
  }
  renderVals() {
    const { digits, lang, step, error, shake } = this.state;
    const t = this.T[lang];
    const round = (this.props.keyShape ?? 'round') === 'round';
    const pill = on => ({ minWidth: 52, minHeight: 44, padding: '0 14px', border: 'none', background: on ? '#e8c070' : 'transparent', color: on ? '#3a0a0c' : '#f6e3b4', fontFamily: 'inherit', fontWeight: 700, fontSize: 15, letterSpacing: '.08em', cursor: 'pointer' });
    const keyBase = { minHeight: 'clamp(64px,8.4vh,86px)', borderRadius: round ? 999 : 14, border: '1px solid rgba(232,192,112,.55)', background: 'rgba(19,40,28,.72)', color: '#fbf1df', fontFamily: 'inherit', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, transition: 'transform .08s, background .12s', userSelect: 'none' };
    const letters = ['', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
    const keys = [1,2,3,4,5,6,7,8,9].map(n => ({ label: String(n), sub: letters[n-1], aria: String(n), size: 'clamp(28px,3vw,36px)', subColor: '#9fb7a6', style: keyBase, press: () => this.press(String(n)) }));
    const ghost = { ...keyBase, background: 'transparent', border: '1px solid rgba(232,192,112,.25)' };
    keys.push({ label: t.clear, sub: '', aria: t.clear, size: '16px', subColor: '#9fb7a6', style: ghost, press: () => this.setState({ digits: '', error: '' }) });
    keys.push({ label: '0', sub: '+', aria: '0', size: 'clamp(28px,3vw,36px)', subColor: '#9fb7a6', style: keyBase, press: () => this.press('0') });
    keys.push({ label: '⌫', sub: '', aria: t.del, size: '28px', subColor: '#9fb7a6', style: ghost, press: () => this.back() });
    const ready = digits.length === 10;
    const filled = digits.length > 0;
    return {
      t, keys, error,
      ctaLabel: this.state.busy ? '…' : t.cta,
      isEntry: step === 'entry', isDone: step === 'done',
      countdown: this.state.countdown,
      display: this.fmt(digits),
      enStyle: pill(lang === 'en'), esStyle: pill(lang === 'es'),
      setEn: () => this.setState({ lang: 'en', error: '' }), setEs: () => this.setState({ lang: 'es', error: '' }),
      displayStyle: { display: 'flex', flexDirection: 'column', gap: 8, padding: '18px 22px', borderRadius: 16, background: '#fbf1df0d', border: '2px solid ' + (error ? '#ff9a80' : ready ? '#e8c070' : 'rgba(232,192,112,.35)'), animation: error ? 'shake .4s' : 'none' },
      numberStyle: { fontSize: 'clamp(30px,3.4vw,44px)', fontWeight: 600, letterSpacing: '.04em', fontVariantNumeric: 'tabular-nums', color: filled ? '#fbf1df' : 'rgba(251,241,223,.35)', whiteSpace: 'nowrap' },
      notReady: this.state.busy,
      submitStyle: { minHeight: 72, borderRadius: round ? 999 : 14, border: 'none', background: ready ? 'linear-gradient(180deg,#f3d48a,#d9a84e)' : 'rgba(232,192,112,.25)', color: ready ? '#3a0a0c' : 'rgba(251,241,223,.6)', fontFamily: "'Playfair Display',serif", fontWeight: 800, fontSize: 26, letterSpacing: '.02em', cursor: 'pointer', boxShadow: ready ? '0 10px 30px rgba(217,168,78,.35)' : 'none', transition: 'all .2s' },
      submit: () => this.submit(), reset: () => this.reset()
    };
  }
}
</script>
</body>
</html>
